<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="slateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3444" />
      <stop offset="100%" stop-color="#141922" />
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>
  </defs>

  <!-- Background Squircle with Palette Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#slateBg)" stroke="#404f68" stroke-width="2.5" />

  <!-- Monogram 'ma' -->
  <text 
    x="12" 
    y="42" 
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" 
    font-size="28" 
    font-weight="800" 
    fill="#ffffff"
    letter-spacing="-1px"
  >ma</text>

  <!-- Glowing Accent Dot '.' -->
  <circle cx="50" cy="38.5" r="4.5" fill="url(#dotGlow)" stroke="#10b981" stroke-width="0.5" />
</svg>
